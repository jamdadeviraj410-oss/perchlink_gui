# PerchLink Disaster SOS - dnsmasq DHCP and DNS Configuration
# Provides local IP leases and Captive Portal DNS redirection

# Bind only to the local Wi-Fi interface
interface=wlan0
bind-interfaces

# DHCP IP Range for connected survivor smartphones
dhcp-range=192.168.4.10,192.168.4.150,255.255.255.0,24h

# Announce drone as default gateway and primary DNS server
dhcp-option=3,192.168.4.1
dhcp-option=6,192.168.4.1

# Captive Portal Redirection:
# Forces all DNS queries to resolve to the drone's web server (192.168.4.1)
# Triggers Apple "Captive Network Assistant" and Android "Sign in to network" popup
address=/#/192.168.4.1
