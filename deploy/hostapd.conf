# PerchLink Disaster SOS - hostapd Wi-Fi Access Point Configuration
# Hardware target: Raspberry Pi 4 Model B (Broadcom BCM43455 802.11ac Wi-Fi)

interface=wlan0
driver=nl80211
ssid=PERCHLINK_SOS
hw_mode=g
channel=7
wmm_enabled=0
macaddr_acl=0
auth_algs=1
ignore_broadcast_ssid=0

# Open network (no encryption) - essential for quick survivor access in emergencies
# Zero SIM, zero cellular, zero cloud dependency
